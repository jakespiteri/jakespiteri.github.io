<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- terminal-prompt mark: > chevron (accent blue) + caret block (amber),
       on a light glass tile. Faint CV contour rings read only at >=64px. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="1" stop-color="#e7edf6"/>
    </linearGradient>
    <clipPath id="tile"><rect x="1" y="1" width="62" height="62" rx="14"/></clipPath>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#ground)"/>

  <g clip-path="url(#tile)">
    <!-- contour rings of the LOOCV surface, top-right, quiet -->
    <g fill="none" stroke="#1290ff" stroke-width="1.6">
      <circle cx="51" cy="11" r="9"  stroke-opacity="0.16"/>
      <circle cx="51" cy="11" r="17" stroke-opacity="0.12"/>
      <circle cx="51" cy="11" r="25" stroke-opacity="0.08"/>
    </g>
    <!-- specular rim: bright top-left, soft bottom-right -->
    <rect x="2" y="2" width="60" height="60" rx="13" fill="none"
          stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none"
        stroke="#1d2433" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- >  -->
  <path d="M 17 20 L 30 32 L 17 44" fill="none" stroke="#1290ff"
        stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- caret block -->
  <rect x="37" y="20.5" width="10" height="24" rx="2" fill="#c2873a"/>
</svg>
